<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Mono 3D en RA</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">

    <a-marker preset="hiro">

      <a-plane 
        position="0 0 0" 
        rotation="-90 0 0" 
        width="2" 
        height="2" 
        color="#3a7d44" 
        opacity="0.8"
        shadow></a-plane>

      <a-entity 
        id="mono" 
        position="0 0.5 0" 
        scale="0.6 0.6 0.6" 
        rotation="0 0 0"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear;">

        <a-sphere position="0 0 0" radius="0.5" color="#8B5A2B"></a-sphere>

        <a-sphere position="0 0.75 0" radius="0.4" color="#A0522D"></a-sphere>

        <a-sphere position="0 0.68 0.32" radius="0.22" color="#F5DEB3"></a-sphere>

        <a-sphere position="-0.13 0.85 0.32" radius="0.06" color="#000"></a-sphere>
        <a-sphere position=" 0.13 0.85 0.32" radius="0.06" color="#000"></a-sphere>

        <a-sphere position="-0.35 0.85 0" radius="0.15" color="#8B5A2B"></a-sphere>
        <a-sphere position=" 0.35 0.85 0" radius="0.15" color="#8B5A2B"></a-sphere>

        <a-cylinder position="-0.55 0.1 0" radius="0.08" height="0.6" color="#8B5A2B" rotation="0 0 25"></a-cylinder>
        <a-cylinder position=" 0.55 0.1 0" radius="0.08" height="0.6" color="#8B5A2B" rotation="0 0 -25"></a-cylinder>

        <a-cylinder position="-0.2 -0.5 0" radius="0.09" height="0.5" color="#8B5A2B"></a-cylinder>
        <a-cylinder position=" 0.2 -0.5 0" radius="0.09" height="0.5" color="#8B5A2B"></a-cylinder>

        <a-cylinder position="0 -0.2 -0.5" radius="0.05" height="0.7" color="#8B5A2B" rotation="90 0 0"></a-cylinder>
      </a-entity>

      <a-entity 
        id="zonaToque"
        geometry="primitive: sphere; radius: 1"
        material="opacity: 0; transparent: true"
        position="0 0.5 0"
        class="clickable"
        evento-tap></a-entity>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <div style="position:fixed; bottom:15px; left:0; right:0; text-align:center; z-index:999;">
    <button onclick="cambiarColor()"    style="padding:12px 18px; margin:5px; border-radius:10px; border:none; background:#ff6b6b; color:#fff; font-size:16px;">🎨 Cambiar color</button>
    <button onclick="cambiarTamano()"   style="padding:12px 18px; margin:5px; border-radius:10px; border:none; background:#4dabf7; color:#fff; font-size:16px;">📏 Tamaño</button>
    <button onclick="girarMono()"       style="padding:12px 18px; margin:5px; border-radius:10px; border:none; background:#51cf66; color:#fff; font-size:16px;">🔄 Girar</button>
    <button onclick="moverMono()"       style="padding:12px 18px; margin:5px; border-radius:10px; border:none; background:#fcc419; color:#000; font-size:16px;">➡️ Mover</button>
  </div>

  <script>
    const mono = document.getElementById('mono');
    let escala = 0.6;
    let girando = true;

    // Cambiar color de todo el mono
    function cambiarColor() {
      const colores = ['#8B5A2B', '#E63946', '#457B9D', '#2A9D8F', '#F4A261', '#9D4EDD'];
      const nuevo = colores[Math.floor(Math.random() * colores.length)];
      mono.querySelectorAll('a-sphere, a-cylinder').forEach(el => {
        el.setAttribute('color', nuevo);
      });
    }

    // Cambiar tamaño
    function cambiarTamano() {
      escala = escala === 0.6 ? 1.1 : (escala === 1.1 ? 1.6 : 0.6);
      mono.setAttribute('scale', `${escala} ${escala} ${escala}`);
    }

    // Pausar / reanudar rotación
    function girarMono() {
      if (girando) {
        mono.removeAttribute('animation');
      } else {
        mono.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear;');
      }
      girando = !girando;
    }

    // Mover posición
    function moverMono() {
      const x = (Math.random() * 1.2 - 0.6).toFixed(2);
      const y = (0.4 + Math.random() * 0.5).toFixed(2);
      mono.setAttribute('position', `${x} ${y} 0`);
    }

    // Interacción al TOCAR el mono directamente
    document.addEventListener('DOMContentLoaded', () => {
      const zona = document.querySelector('[evento-tap]');
      zona.addEventListener('click', () => {
        cambiarColor();
        cambiarTamano();
      });
    });
  </script>

</body>
</html>
