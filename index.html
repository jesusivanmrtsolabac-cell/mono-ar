<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mi Mono 3D en RA</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #controles {
      position: fixed; bottom: 12px; left: 0; right: 0;
      text-align: center; z-index: 9999;
    }
    #controles button {
      padding: 12px 14px; margin: 4px 3px; border-radius: 10px;
      border: none; font-size: 15px; font-weight: bold;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    #info {
      position: fixed; top: 10px; left: 0; right: 0;
      text-align: center; color: white; z-index: 9999;
      text-shadow: 0 0 6px black; font-size: 14px;
    }
  </style>
</head>

<body>

  <div id="info">👆 Toca al mono o usa los botones</div>

  <a-scene 
    embedded 
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    renderer="antialias: true; alpha: true;"
    vr-mode-ui="enabled: false">

    <a-marker preset="hiro" id="marcador">

      <!-- 🟫 Piso -->
      <a-plane 
        position="0 0 0" 
        rotation="-90 0 0" 
        width="2.2" height="2.2" 
        color="#3a7d44" opacity="0.85"></a-plane>

      <!-- 🐵 MONO 3D -->
      <a-entity 
        id="mono" 
        position="0 0.5 0" 
        scale="0.6 0.6 0.6" 
        rotation="0 0 0"
        animation__giro="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear;"
        class="clickable">

        <a-sphere position="0 0 0" radius="0.5" color="#8B5A2B" class="parte"></a-sphere>
        <a-sphere position="0 0.75 0" radius="0.4" color="#A0522D" class="parte"></a-sphere>
        <a-sphere position="0 0.68 0.32" radius="0.22" color="#F5DEB3" class="parte"></a-sphere>
        <a-sphere position="-0.13 0.85 0.32" radius="0.06" color="#000" class="parte"></a-sphere>
        <a-sphere position=" 0.13 0.85 0.32" radius="0.06" color="#000" class="parte"></a-sphere>
        <a-sphere position="-0.35 0.85 0" radius="0.15" color="#8B5A2B" class="parte"></a-sphere>
        <a-sphere position=" 0.35 0.85 0" radius="0.15" color="#8B5A2B" class="parte"></a-sphere>
        <a-cylinder position="-0.55 0.1 0" radius="0.08" height="0.6" color="#8B5A2B" rotation="0 0 25" class="parte"></a-cylinder>
        <a-cylinder position=" 0.55 0.1 0" radius="0.08" height="0.6" color="#8B5A2B" rotation="0 0 -25" class="parte"></a-cylinder>
        <a-cylinder position="-0.2 -0.5 0" radius="0.09" height="0.5" color="#8B5A2B" class="parte"></a-cylinder>
        <a-cylinder position=" 0.2 -0.5 0" radius="0.09" height="0.5" color="#8B5A2B" class="parte"></a-cylinder>
        <a-cylinder position="0 -0.2 -0.5" radius="0.05" height="0.7" color="#8B5A2B" rotation="90 0 0" class="parte"></a-cylinder>

      </a-entity>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <!-- 🎛️ Botones -->
  <div id="controles">
    <button onclick="cambiarColor()"  style="background:#ff6b6b;color:#fff;">🎨 Color</button>
    <button onclick="cambiarTamano()" style="background:#4dabf7;color:#fff;">📏 Tamaño</button>
    <button onclick="girarMono()"     style="background:#51cf66;color:#fff;">🔄 Girar</button>
    <button onclick="moverMono()"     style="background:#fcc419;color:#000;">➡️ Mover</button>
  </div>

  <script>
    let escala = 0.6;
    let girando = true;
    let offsetX = 0;

    function getMono() { return document.getElementById('mono'); }

    // 🎨 Cambiar color
    function cambiarColor() {
      const mono = getMono();
      const colores = ['#8B5A2B', '#E63946', '#457B9D', '#2A9D8F', '#F4A261', '#9D4EDD', '#FF69B4'];
      const nuevo = colores[Math.floor(Math.random() * colores.length)];
      mono.querySelectorAll('.parte').forEach(el => el.setAttribute('color', nuevo));
    }

    // 📏 Cambiar tamaño
    function cambiarTamano() {
      const mono = getMono();
      escala = escala >= 1.6 ? 0.6 : escala + 0.3;
      mono.setAttribute('scale', `${escala} ${escala} ${escala}`);
    }

    // 🔄 Girar / pausar
    function girarMono() {
      const mono = getMono();
      if (girando) {
        mono.removeAttribute('animation__giro');
      } else {
        mono.setAttribute('animation__giro', 'property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear;');
      }
      girando = !girando;
    }

    // ➡️ Mover
    function moverMono() {
      const mono = getMono();
      offsetX = (offsetX + 0.4) > 0.6 ? -0.6 : offsetX + 0.4;
      const y = 0.5 + Math.random() * 0.4;
      mono.setAttribute('position', `${offsetX.toFixed(2)} ${y.toFixed(2)} 0`);
    }

    // 👆 TOCAR el mono directamente (funciona con A-Frame)
    window.addEventListener('load', () => {
      const mono = getMono();
      mono.addEventListener('click', () => {
        cambiarColor();
        cambiarTamano();
      });
      mono.addEventListener('touchstart', () => {
        cambiarColor();
        cambiarTamano();
      });
    });
  </script>

</body>
</html>
